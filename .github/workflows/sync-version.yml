name: Sync version

on:
  push:
    branches: [main]
    paths:
      - version
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-version
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync version into README, website and script
        run: python3 .github/scripts/sync-version.py

      - name: Commit changes
        run: |
          if git diff --quiet; then
              echo "Version is already in sync."
              exit 0
          fi
          VERSION=$(tr -d '[:space:]' < version)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md index.html changelog/index.html lib/core
          git commit -m "chore: sync version ${VERSION}"
          git push
